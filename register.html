<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | College Quiz Reviewer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">

  <nav class="navbar" aria-label="Main navigation">
    <div class="container">
      <a class="brand" href="index.html">College Quiz Reviewer</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#subjects">Subjects</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="upload.html">Upload Quiz</a></li>
      </ul>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1>Create an account</h1>
      <p>Register with your Gmail. We will email you a 6-digit code to verify it.</p>
    </div>
  </header>

  <main class="container">
    <section class="panel auth-panel">
      <form id="reg-form" novalidate>
        <label class="field-label" for="name">Full name</label>
        <input class="text-input" type="text" id="name" autocomplete="name" maxlength="100" required>
        <label class="field-label" for="email">Gmail address</label>
        <input class="text-input" type="email" id="email" autocomplete="email" placeholder="yourname@gmail.com" required>
        <label class="field-label" for="password">Password</label>
        <input class="text-input" type="password" id="password" autocomplete="new-password" minlength="8" required>
        <p class="section-sub" style="margin:-.4rem 0 .75rem;font-size:.9rem">At least 8 characters, with a letter and a number.</p>
        <label class="field-label" for="password2">Confirm password</label>
        <input class="text-input" type="password" id="password2" autocomplete="new-password" required>
        <button type="submit" class="btn btn-primary" id="submit-btn">Create account</button>
      </form>
      <div id="status" class="status hidden" role="status" aria-live="polite"></div>
      <p class="auth-links">Already registered? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <footer>College Quiz Reviewer &middot; Application Development Project</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
